[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-analyst-agent"
version = "0.1.0"
description = "An AI agent that investigates a SaaS billing API and reports cited business findings, with an eval suite built on planted anomalies."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Guillaume Bloch-Baraux" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0", "mcp>=2.0"]

[project.scripts]
analyst = "saas_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
